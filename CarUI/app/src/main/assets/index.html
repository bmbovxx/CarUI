<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واجهة السيارة</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--card:#151c2a;--card2:#1d2638;--tx:#f2f5fa;--mu:#8b97ad;--ac:#3ea6ff;--ok:#2ecc8f;box-sizing:border-box}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;transform-origin:center}
header{height:130px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #1f2940}
.clock{font-size:76px;font-weight:700;letter-spacing:2px;direction:ltr;display:flex;align-items:baseline;gap:12px}
.clock small{font-size:30px;color:var(--ac)}
.date{font-size:28px}.date div:last-child{font-size:22px;color:var(--mu);margin-top:6px}
.wx{display:flex;align-items:center;gap:18px;background:var(--card);padding:14px 28px;border-radius:24px}
.wx .i{font-size:56px}.wx b{font-size:44px;display:block;direction:ltr}.wx span{color:var(--mu);font-size:20px}
main{flex:1;padding:24px 40px;min-height:0}
.pane{display:none;height:100%}.pane.on{display:flex}
footer{height:130px;display:flex;align-items:center;gap:28px;padding:0 40px;border-top:1px solid #1f2940;background:#0e1420}
.tabs{display:flex;gap:16px}
.tab{width:175px;height:84px;border:0;border-radius:22px;background:var(--card);color:var(--mu);font-size:26px;display:flex;align-items:center;justify-content:center;gap:12px}
.tab.on{background:var(--ac);color:#04111f;font-weight:700}
.vol{flex:1;display:flex;align-items:center;gap:18px;direction:ltr}
.vol button{border:0;background:var(--card);color:var(--tx);width:72px;height:72px;border-radius:50%;font-size:32px}
.vol input{flex:1;height:14px;-webkit-appearance:none;appearance:none;border-radius:8px;background:linear-gradient(to right,var(--ac) var(--p,50%),var(--card2) var(--p,50%))}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:50px;height:50px;border-radius:50%;background:#fff;border:6px solid var(--ac)}
.vol output{width:64px;font-size:28px;text-align:center}
/* media */
.media{gap:24px;width:100%}
.mc{width:560px;flex:none;background:var(--card);border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.mc .top{display:flex;gap:22px;align-items:center}
.art{width:150px;height:150px;flex:none;border-radius:24px;background:linear-gradient(135deg,#3ea6ff,#7a5cff);display:flex;align-items:center;justify-content:center;font-size:56px}
.mc h2{font-size:34px}.mc p{font-size:22px;color:var(--mu);margin-top:6px}
.mc .src{margin-top:0}
.mini{flex:1;position:relative;border-radius:28px;overflow:hidden;background:#101a2b}.mini svg{width:100%;height:100%}.mini .search,.mini .fab{display:none}
.mini::after{content:"اضغط لفتح الخريطة";position:absolute;bottom:16px;right:16px;background:rgba(21,28,42,.9);padding:10px 20px;border-radius:16px;font-size:20px;color:var(--mu)}
.bar{height:18px;cursor:pointer;border-radius:9px;background:var(--card2);overflow:hidden;direction:ltr}.bar i{display:block;height:100%;width:35%;background:var(--ac)}
.ctl{display:flex;gap:18px;justify-content:center;direction:ltr}
.ctl button{border:0;background:var(--card2);color:var(--tx);width:100px;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.ctl button:active{transform:scale(.94)}
.ctl .pl{background:var(--ac);color:#04111f;width:160px;box-shadow:0 8px 24px rgba(62,166,255,.35)}
.ctl svg{width:42px;height:42px;fill:currentColor}
.src{display:flex;gap:14px}.src button{flex:1;height:64px;border:0;border-radius:18px;background:var(--card);color:var(--tx);font-size:22px}.src .on{outline:2px solid var(--ac)}
/* prayer */
.pr{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.p{background:var(--card);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.p span{font-size:30px;color:var(--mu)}.p b{font-size:56px;direction:ltr}
.p.next{background:var(--ac);color:#04111f}.p.next span{color:#04111f}.p small{font-size:22px;min-height:26px}
/* map */
.map{width:100%;position:relative;border-radius:28px;overflow:hidden;background:#101a2b}
.map svg{width:100%;height:100%}
.search{position:absolute;top:18px;right:18px;left:18px;height:72px;border-radius:36px;background:rgba(21,28,42,.95);display:flex;align-items:center;padding:0 28px;font-size:26px;color:var(--mu)}
.fab{position:absolute;bottom:22px;left:22px;width:84px;height:84px;border-radius:50%;background:var(--ac);color:#04111f;font-size:40px;display:flex;align-items:center;justify-content:center}
#ssb{font-size:20px}
#ss{position:absolute;top:0;right:0;bottom:0;left:0;background:#000;z-index:99;display:none;align-items:center;justify-content:center}
#ss.on{display:flex}
#ss svg{width:600px;height:600px}
.ib{width:84px;height:84px;flex:none;border:0;border-radius:22px;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:46px}
.ib svg{width:44px;height:44px;fill:currentColor}.ib:active{transform:scale(.94)}
#ap{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:90;display:none;flex-direction:column;padding:28px 40px}
#ap.on{display:flex}
.aph{display:flex;align-items:center;justify-content:space-between;font-size:36px;font-weight:700;margin-bottom:20px}
.aph button{border:0;background:var(--card);color:var(--tx);height:72px;padding:0 36px;border-radius:22px;font-size:26px}
#ag{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:18px;align-content:start}
.app{background:var(--card);border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;border:0;color:var(--tx);font-size:20px}
.app img{width:72px;height:72px;border-radius:16px}
.app span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini::after{z-index:1000}
.search,.fab{z-index:1000}
.search{gap:12px}
.qi{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font-size:26px}
.go{border:0;background:var(--ac);color:#04111f;height:52px;padding:0 24px;border-radius:26px;font-size:22px;font-weight:700}
.fab2{background:var(--card2);color:var(--tx);bottom:120px;font-size:36px}
.chip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(21,28,42,.95);padding:16px 32px;border-radius:24px;font-size:28px;white-space:nowrap}
.tm{display:flex;justify-content:space-between;direction:ltr;color:var(--mu);font-size:20px;margin-top:8px}
.mc .top{cursor:pointer}
.mini,.map{z-index:0}
.msg{grid-column:1/-1;font-size:26px;color:var(--mu)}
.me{width:30px;height:30px;border-radius:50%;background:#3ea6ff;border:5px solid #fff;box-shadow:0 0 0 0 rgba(62,166,255,.6),0 2px 8px rgba(0,0,0,.6);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 26px rgba(62,166,255,0),0 2px 8px rgba(0,0,0,.6)}100%{box-shadow:0 0 0 0 rgba(62,166,255,0),0 2px 8px rgba(0,0,0,.6)}}
</style>
</head>
<body>
<div id="stage">
<header>
  <div class="clock"><span id="t">12:00</span><small id="ap">م</small></div>
  <div class="date"><div id="d1"></div><div id="d2"></div></div>
  <div class="wx"><div class="i">⛅</div><div><b>32°</b><span>غائم جزئيًا · الرياض</span></div></div>
</header>
<main>
  <section class="pane media on" id="media">
    <div class="mc">
      <div class="top"><div class="art">🎵</div><div><h2>اسم المقطع الحالي</h2><p>اسم الفنان · الألبوم</p></div></div>
      <div><div class="bar"><i></i></div><div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
      <div class="ctl">
        <button><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
        <button class="pl" id="pl"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM14.5 12L6 6v12z"/></svg></button>
      </div>
      <div class="src"><button class="on">بلوتوث</button><button>USB</button><button>راديو</button><button>AUX</button></div>
    </div>
    <div class="mini" id="mm"></div>
  </section>
  <section class="pane" id="prayer"><div class="pr" id="prl"></div></section>
  <section class="pane" id="map">
    <div class="map">
      <svg viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice">
        <rect width="1200" height="460" fill="#101a2b"/>
        <g stroke="#1c2a44" stroke-width="26" fill="none"><path d="M0 120H1200M0 330H1200M200 0V460M620 0V460M980 0V460"/></g>
        <g stroke="#2b3d61" stroke-width="10" fill="none"><path d="M0 230L420 230L620 330L1200 150"/></g>
        <path d="M180 440L400 300L620 250" stroke="#3ea6ff" stroke-width="12" fill="none" stroke-linecap="round"/>
        <circle cx="620" cy="250" r="16" fill="#2ecc8f"/>
        <path d="M180 440l-18-32a24 24 0 1 1 36 0z" fill="#3ea6ff"/>
      </svg>
      <div class="search">🔍 &nbsp;ابحث عن وجهة...</div>
      <div class="fab">➤</div>
    </div>
  </section>
</main>
<footer>
  <div class="tabs">
    <button class="tab on" data-p="media">🎵 الوسائط</button>
    <button class="tab" data-p="prayer">🕌 الصلاة</button>
    <button class="tab" id="ssb">🌙 شاشة التوقف</button>
  </div>
  <div class="vol">
    <button id="mute">🔊</button>
    <input type="range" id="v" min="0" max="100" value="50">
    <output id="vo">50</output>
  </div>
  <button class="ib" id="appb"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
  <button class="ib" id="setb">&#9881;</button>
</footer>
<div id="ap"><div class="aph"><span>التطبيقات</span><button id="apc">إغلاق ✕</button></div><div id="ag"></div></div>
<div id="ss"><svg viewBox="-100 -100 200 200"><circle r="96" fill="none" stroke="#2a2f3a" stroke-width="2"/><g id="tk" stroke="#8b97ad"></g><line id="hh" y2="-48" stroke="#f2f5fa" stroke-width="5" stroke-linecap="round"/><line id="mh" y2="-72" stroke="#f2f5fa" stroke-width="3.5" stroke-linecap="round"/><line id="sh" y1="14" y2="-80" stroke="#3ea6ff" stroke-width="1.5"/><circle r="4" fill="#3ea6ff"/></svg></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
var P=[['الفجر','04:42'],['الشروق','06:03'],['الظهر','11:38'],['العصر','14:55'],['المغرب','17:13'],['العشاء','18:43']];
function pad(n){return n<10?'0'+n:n}
function tick(){
  var n=new Date(),h=n.getHours();
  $('t').textContent=(h%12||12)+':'+pad(n.getMinutes());
  $('ap').textContent=h<12?'ص':'م';
  try{$('d1').textContent=n.toLocaleDateString('ar-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('d2').textContent=n.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
  var m=h*60+n.getMinutes(),ni=P.findIndex(function(x){var a=x[1].split(':');return +a[0]*60+ +a[1]>m});if(ni<0)ni=0;
  var html='';P.forEach(function(x,i){var a=x[1].split(':'),ap12=((+a[0])%12||12)+':'+a[1],d=+a[0]*60+ +a[1]-m;if(d<0)d+=1440;
    html+='<div class="p'+(i==ni?' next':'')+'"><span>'+x[0]+'</span><b>'+ap12+'</b><small>'+(i==ni?'بعد '+Math.floor(d/60)+'س '+d%60+'د':'')+'</small></div>'});
  $('prl').innerHTML=html;
}
tick();setInterval(tick,1000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tab,.pane').forEach(function(e){e.classList.remove('on')});
  b.classList.add('on');$(b.dataset.p).classList.add('on')}});
var v=$('v'),last=50;
function setV(){$('vo').textContent=v.value;v.style.setProperty('--p',v.value+'%');$('mute').textContent=v.value==0?'🔇':v.value<40?'🔉':'🔊'}
v.oninput=setV;setV();
$('mute').onclick=function(){if(+v.value){last=v.value;v.value=0}else v.value=last;setV()};
var playing=false;
$('pl').onclick=function(){playing=!playing;this.innerHTML='<svg viewBox="0 0 24 24"><path d="'+(playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M8 5v14l11-7z')+'"/></svg>'};
$('mm').innerHTML=document.querySelector('#map .map').innerHTML;
$('mm').onclick=function(){document.querySelectorAll('.tab,.pane').forEach(function(e){e.classList.remove('on')});$('map').classList.add('on')};
var tk='';for(var i=0;i<60;i++){var a=i*6*Math.PI/180,l=i%5?3:9,r=92;tk+='<line x1="'+(Math.sin(a)*r)+'" y1="'+(-Math.cos(a)*r)+'" x2="'+(Math.sin(a)*(r-l))+'" y2="'+(-Math.cos(a)*(r-l))+'" stroke-width="'+(i%5?1:3)+'"/>'}
$('tk').innerHTML=tk;
function hands(){var n=new Date(),s=n.getSeconds(),m=n.getMinutes()+s/60,h=n.getHours()%12+m/60;$('hh').setAttribute('transform','rotate('+h*30+')');$('mh').setAttribute('transform','rotate('+m*6+')');$('sh').setAttribute('transform','rotate('+s*6+')')}
hands();setInterval(hands,1000);
$('ssb').onclick=function(){$('ss').classList.add('on')};
$('ss').onclick=function(){this.classList.remove('on')};
function esc(t){return t.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('appb').onclick=function(){
  var g=$('ag');
  g.innerHTML='<p class="msg">جارٍ التحميل...</p>';
  $('ap').classList.add('on');
  setTimeout(function(){
    var list=[];
    try{list=JSON.parse(window.Android.apps())}catch(e){g.innerHTML='<p class="msg">'+(window.Android?'تعذر تحميل التطبيقات':'هذه الميزة تعمل داخل تطبيق الأندرويد فقط')+'</p>';return}
    if(!list.length){g.innerHTML='<p class="msg">لم يتم العثور على تطبيقات</p>';return}
    g.innerHTML=list.map(function(a){return '<button class="app" data-p="'+esc(a.p)+'"><img src="data:image/png;base64,'+a.i+'"><span>'+esc(a.n)+'</span></button>'}).join('')
  },50)};
$('ag').onclick=function(e){var b=e.target.closest('.app');if(b){window.Android.launch(b.dataset.p);$('ap').classList.remove('on')}};
$('apc').onclick=function(){$('ap').classList.remove('on')};
$('setb').onclick=function(){try{window.Android.settings()}catch(e){}};
if(window.Android&&Android.loc){(function(){
var M=[],mes=[],pos=[24.7136,46.6753],follow=true,fix=false,dest=null,line=null,fm,mq=document.querySelector('#map .map');
function ld(t,u,f){var e=document.createElement(t);if(t=='link'){e.rel='stylesheet';e.href=u}else{e.src=u;e.onload=f}document.head.appendChild(e)}
ld('link','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');
ld('script','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',init);
function mk(el,full){
 var m=L.map(el,{zoomControl:false,attributionControl:false,dragging:full,touchZoom:full,doubleClickZoom:full,scrollWheelZoom:false,boxZoom:false,keyboard:false}).setView(pos,full?16:15);
 var T='https://server.arcgisonline.com/ArcGIS/rest/services/';
 L.tileLayer(T+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
 L.tileLayer(T+'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
 L.tileLayer(T+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
 mes.push(L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[30,30],iconAnchor:[15,15]}),interactive:false,keyboard:false,opacity:0}).addTo(m));
 M.push(m);return m}
function init(){
 var mm=$('mm');mm.innerHTML='';mk(mm,false);
 mq.querySelector('svg').style.display='none';
 var d=document.createElement('div');d.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0';mq.insertBefore(d,mq.firstChild);
 fm=mk(d,true);fm.on('dragstart',function(){follow=false});
 var rt=document.createElement('div');rt.className='chip';rt.style.display='none';mq.appendChild(rt);
 function say(t){rt.textContent=t;rt.style.display='block'}
 function find(q){if(!q)return;
  if(!fix){say('بانتظار إشارة GPS...');return}
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
   if(!j.length){say('لم يتم العثور على الوجهة');return}
   dest=[+j[0].lat,+j[0].lon];
   return fetch('https://router.project-osrm.org/route/v1/driving/'+pos[1]+','+pos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson').then(function(r){return r.json()}).then(function(o){
    var r=o.routes[0],c=r.geometry.coordinates.map(function(p){return[p[1],p[0]]});
    if(line)fm.removeLayer(line);
    line=L.polyline(c,{color:'#3ea6ff',weight:7}).addTo(fm);
    follow=false;fm.fitBounds(line.getBounds(),{padding:[120,120]});
    say((r.distance/1000).toFixed(1)+' كم · '+Math.round(r.duration/60)+' دقيقة')})
  }).catch(function(){say('تعذر الاتصال بالإنترنت')})}
 var s=mq.querySelector('.search');
 s.innerHTML='🔍<input class="qi" placeholder="ابحث عن وجهة..."><button class="go">بحث</button>';
 var qi=s.querySelector('.qi');
 s.querySelector('.go').onclick=function(){find(qi.value)};
 qi.onkeydown=function(e){if(e.key=='Enter')find(qi.value)};
 var f2=document.createElement('div');f2.className='fab fab2';f2.textContent='📍';
 f2.onclick=function(){if(!fix){say(Android.gps&&Android.gps()=='denied'?'إذن الموقع غير مفعّل لتطبيق الشاشة':'بانتظار إشارة GPS... تأكد من تفعيل الموقع');if(!line)setTimeout(function(){rt.style.display='none'},4000);return}follow=true;fm.setView(pos,16)};mq.appendChild(f2);
 [['+',1,22],['−',-1,120]].forEach(function(z){var b=document.createElement('div');b.className='fab fab2';b.style.cssText='left:auto;right:22px;bottom:'+z[2]+'px';b.textContent=z[0];b.onclick=function(){fm.zoomBy(z[1])};mq.appendChild(b)});
 mq.querySelector('.fab').onclick=function(){if(dest)Android.navigate(String(dest[0]),String(dest[1]))};
 setInterval(function(){var r=Android.loc();if(r){var a=r.split(',');fix=true;pos=[+a[0],+a[1]];mes.forEach(function(x){x.setLatLng(pos);x.setOpacity(1)});M[0].setView(pos);if(follow)fm.setView(pos)}},2000);
 document.addEventListener('click',function(){setTimeout(function(){M.forEach(function(x){x.invalidateSize()})},80)});
}
})()}
if(window.Android&&Android.media){(function(){
var T=document.querySelector('.mc h2'),A=document.querySelector('.mc .top p'),art=document.querySelector('.mc .art'),bw=document.querySelector('.mc .bar'),bi=bw.firstChild,tc=$('tc'),td=$('td'),b=document.querySelectorAll('.ctl button'),pl=$('pl'),k='',st='',dur=0,lp=null;
function f(ms){var x=Math.max(0,Math.floor(ms/1000));return Math.floor(x/60)+':'+('0'+x%60).slice(-2)}
function ic(p){return '<svg viewBox="0 0 24 24"><path d="'+(p?'M6 5h4v14H6zM14 5h4v14h-4z':'M8 5v14l11-7z')+'"/></svg>'}
b[0].onclick=function(){Android.mediaCmd('prev')};
b[2].onclick=function(){Android.mediaCmd('next')};
pl.onclick=function(){Android.mediaCmd('toggle')};
bw.onclick=function(e){if(dur){var r=bw.getBoundingClientRect();Android.mediaSeek(String(Math.round(dur*(e.clientX-r.left)/r.width)))}};
document.querySelector('.mc .top').onclick=function(){if(st=='noaccess')Android.notifSettings()};
function reset(){art.style.backgroundImage='';art.textContent='🎵';bi.style.width='0';tc.textContent=td.textContent='0:00';dur=0;k=''}
setInterval(function(){
